services:
  # 1. Dịch vụ Cache Redis
  redis:
    image: redis:7-alpine
    container_name: app_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # 2. Dịch vụ Backend (NodeJS Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_backend
    restart: always
    ports:
      - "5000:3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis
      - REDIS_PORT=6379
      # Các biến khác tự động nhận từ backend/.env hoặc có thể truyền trực tiếp ở đây
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    networks:
      - app-network

  # 3. Dịch vụ Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis_data: